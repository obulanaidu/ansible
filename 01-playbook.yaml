- name: play level variables
  hosts: frontend
  become: yes
  vars:
   COURSE: Devops
   TRAINER: ravi
   DURATION: 10HR
  tasks:
  - name: print course information
    ansible.builtin.debug:
    msg: hello {{COURSE}}























- name: ping the server
  hosts: frontend
  tasks:
  - name: ping the server
    ansible.builtin.ping:

- name: print hello world
  hosts: local
  connection: local
  tasks:
  -name: print hello world
  ansible.builtin.debug:
   msg: "hellow world"

- name: nginx
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    ansible.builtin.package:
     name: nginx
     state: present
  - name: run nginx
    ansible.builtin.service:
     name: nginx
     state: Started
     enabed: yes
     